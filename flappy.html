<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>廖兰兰 · 笨鸟先飞</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;background:#77c7ff}#game{display:block;width:100vw;height:100vh;background:linear-gradient(#7bd7ff 0%,#baf1ff 62%,#8ee06f 63%,#5ac44d 100%)}.hud{position:fixed;left:0;top:0;width:100%;pointer-events:none;text-align:center;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.22);font-weight:900}.title{font-size:24px;margin-top:18px;letter-spacing:2px}.score{font-size:54px;margin-top:12px}.panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(86vw,360px);padding:22px 18px;border-radius:24px;background:rgba(255,255,255,.93);box-shadow:0 14px 40px rgba(0,0,0,.22);text-align:center;color:#27516b}.panel h1{font-size:28px;margin:0 0 8px}.panel p{margin:8px 0;line-height:1.55;font-size:15px}.btn{margin-top:14px;border:0;border-radius:999px;padding:13px 28px;background:#ffcf3f;color:#6b4100;font-weight:900;font-size:18px;box-shadow:0 5px 0 #d69c18}.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #d69c18}.hidden{display:none}.tip{position:fixed;left:0;bottom:18px;width:100%;text-align:center;color:#fff;font-weight:800;text-shadow:0 2px 0 rgba(0,0,0,.25);pointer-events:none}.upload{margin-top:12px;font-size:13px;color:#496;display:block}.upload input{width:100%;margin-top:8px}</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud"><div class="title">廖兰兰 · 笨鸟先飞</div><div id="score" class="score">0</div></div>
<div id="startPanel" class="panel"><h1>廖兰兰小鸟</h1><p>点击屏幕让小鸟飞起来，躲开水管。</p><p>手机浏览器直接打开就能玩。</p><label class="upload">想换成女朋友照片：<input id="photo" type="file" accept="image/*"></label><button id="startBtn" class="btn">开始游戏</button></div>
<div id="overPanel" class="panel hidden"><h1>撞到啦</h1><p id="finalText">本次得分：0</p><button id="restartBtn" class="btn">再来一次</button></div>
<div class="tip">点一下 / 按空格 = 飞一下</div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),scoreEl=document.getElementById('score'),startPanel=document.getElementById('startPanel'),overPanel=document.getElementById('overPanel'),finalText=document.getElementById('finalText');let W,H,DPR;function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();let faceImg=null;document.getElementById('photo').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const img=new Image();img.onload=()=>faceImg=img;img.src=URL.createObjectURL(f)});let bird,pipes,score,state,last,groundX;function reset(){bird={x:W*.28,y:H*.42,r:28,vy:0,rot:0};pipes=[];score=0;state='ready';last=0;groundX=0;scoreEl.textContent='0'}function start(){reset();state='play';startPanel.classList.add('hidden');overPanel.classList.add('hidden');flap();requestAnimationFrame(loop)}function gameOver(){state='over';finalText.textContent='本次得分：'+score;overPanel.classList.remove('hidden')}function flap(){if(state==='play'||state==='ready')bird.vy=-7.2}function addPipe(){const gap=Math.max(150,H*.23),top=90+Math.random()*(H-260-gap);pipes.push({x:W+60,w:74,top,bot:top+gap,passed:false})}function drawCloud(x,y,s){ctx.fillStyle='rgba(255,255,255,.82)';ctx.beginPath();ctx.arc(x,y,18*s,0,7);ctx.arc(x+20*s,y-10*s,24*s,0,7);ctx.arc(x+47*s,y,20*s,0,7);ctx.fill()}function drawBird(){ctx.save();ctx.translate(bird.x,bird.y);ctx.rotate(bird.rot);ctx.fillStyle='#ffd33d';ctx.beginPath();ctx.ellipse(0,0,34,28,0,0,7);ctx.fill();ctx.fillStyle='#ffeb70';ctx.beginPath();ctx.ellipse(-14,8,18,13,-.3,0,7);ctx.fill();ctx.fillStyle='#ff8b27';ctx.beginPath();ctx.moveTo(30,-2);ctx.lineTo(52,8);ctx.lineTo(29,17);ctx.closePath();ctx.fill();ctx.fillStyle='#222';ctx.beginPath();ctx.arc(14,-10,4,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(15,-11,1.5,0,7);ctx.fill();if(faceImg){ctx.save();ctx.beginPath();ctx.arc(-4,-2,20,0,7);ctx.clip();ctx.drawImage(faceImg,-24,-22,40,40);ctx.restore();ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(-4,-2,21,0,7);ctx.stroke()}else{ctx.fillStyle='#ff9fb7';ctx.beginPath();ctx.arc(-7,-1,15,0,7);ctx.fill();ctx.fillStyle='#7b3a2b';ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.fillText('廖兰兰',-7,3)}ctx.restore()}function drawPipe(p){const grd=ctx.createLinearGradient(p.x,0,p.x+p.w,0);grd.addColorStop(0,'#2bad3d');grd.addColorStop(.5,'#79e65f');grd.addColorStop(1,'#188b31');ctx.fillStyle=grd;ctx.fillRect(p.x,0,p.w,p.top);ctx.fillRect(p.x,p.bot,p.w,H-p.bot-70);ctx.fillStyle='#13702b';ctx.fillRect(p.x-7,p.top-24,p.w+14,24);ctx.fillRect(p.x-7,p.bot,p.w+14,24)}function collide(p){const bx=bird.x,by=bird.y,r=bird.r*.82;if(by-r<0||by+r>H-70)return true;return bx+r>p.x&&bx-r<p.x+p.w&&(by-r<p.top||by+r>p.bot)}function drawScene(){ctx.clearRect(0,0,W,H);drawCloud(W*.18,H*.16,1);drawCloud(W*.65,H*.22,.85);drawCloud((W*.9+groundX*.12)%W,H*.12,.7);pipes.forEach(drawPipe);ctx.fillStyle='#65c84d';ctx.fillRect(0,H-70,W,70);ctx.fillStyle='#48a43f';for(let x=(groundX%46)-46;x<W;x+=46){ctx.fillRect(x,H-54,28,8);ctx.fillRect(x+10,H-30,30,7)}drawBird()}function loop(t){if(!last)last=t;const dt=Math.min((t-last)/16.67,2);last=t;if(state==='play'){bird.vy+=.45*dt;bird.y+=bird.vy*dt;bird.rot=Math.max(-.55,Math.min(.9,bird.vy/10));groundX-=2.5*dt;if(!pipes.length||pipes[pipes.length-1].x<W-230)addPipe();pipes.forEach(p=>p.x-=3.1*dt);pipes=pipes.filter(p=>p.x+p.w>-30);for(const p of pipes){if(!p.passed&&p.x+p.w<bird.x){p.passed=true;score++;scoreEl.textContent=score}if(collide(p)){gameOver();break}}}drawScene();if(state==='play')requestAnimationFrame(loop)}addEventListener('pointerdown',()=>{if(state==='play')flap()});addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(state==='play')flap()}});document.getElementById('startBtn').onclick=start;document.getElementById('restartBtn').onclick=start;reset();drawScene();
</script>
</body>
</html>
